# the setup below is used to train a vp-sde model on MNIST dataset.
# it used originally to test whether forward and backward of SDEs are stable
# and the model can generate recognizable digits.


experiment:
  name: mnist_vp_sde_tinyunet
  seed: 32
  device: cuda

dataset:
  name: mnist
  data_dir: ./data
  subset_fraction: 1.0
  image_size: 28
  channels: 1
  normalize: [-1.0, 1.0]

diffusion:
  type: vp_sde
  beta_min: 0.1
  beta_max: 20.0


model:
  name: tiny_unet
  base_channels: 64
  time_embedding_dim: 128

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.00001
  weight_decay: 0.0001
  grad_accumulation: 1
  precision: fp32
  optimizer: adamw
  betas: [0.9, 0.999]
  ema_decay: 0.9999
  warmup_steps: 1000

logging:
  log_freq: 1
  checkpoint_freq: 10
  output_dir: ../mnist