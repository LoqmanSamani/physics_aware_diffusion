experiment:
  name: teacher_train_with_robust_fp_gate
  seed: 42
  device: cuda

data_loader:
  n_molecules: 5000
  n_atom_types: 3
  use_atom_types: True
  min_atoms: 10
  max_atoms: 20

val_loader:
  n_molecules: 1000
  n_atom_types: 3
  use_atom_types: True
  min_atoms: 10
  max_atoms: 20


diffusion:
  type: vp_sde
  beta_start: 0.1
  beta_end: 20.0

model:
  name: graph_energy_net
  atom_dim: 3
  hidden_dim: 256
  num_layers: 6
  dropout: 0.1

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_accumulation: 1
  precision: bf16
  optimizer: adamw
  betas: [0.9, 0.999]
  rotation_augment: True
  warmup_steps: 400

logging:
  log_freq: 5
  checkpoint_freq: 10
  output_dir: ./result