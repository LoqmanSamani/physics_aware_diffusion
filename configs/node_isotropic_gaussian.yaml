experiment:
  name: analytic_node_isotropic_gaussian
  device: cuda

dataset:
  name: NodeGaussian3DToy
  n_samples: 2048
  sigma_min: 0.1
  sigma_max: 2.0

model:
  name: graph_score_net
  time_embedding: TimeEmbedding
  atom_dim: 1
  hidden_dim: 64
  num_layers: 2
  dropout: 0.0

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.0005
  precision: fp32
  optimizer: adam