experiment:
  name: synthetic_molecular_dataset
  seed: 42
  device: cuda

dataset:
  n_molecules: 10000
  n_atom_types: 1
  min_atoms: 5
  max_atoms: 15

diffusion:
  type: vp_sde
  num_steps: 1000
  beta_start: 0.1
  beta_end: 20.0
  time_start: 0.0
  time_end: 1.0

model:
  name: graph_score_net
  atom_dim: 1
  hidden_dim: 256
  num_layers: 6
  dropout: 0.1

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_accumulation: 1
  precision: bf16
  optimizer: adamw
  betas: [0.9, 0.999]
  rotation_augmentation: True
  warmup_steps: 1000

logging:
  log_freq: 5
  checkpoint_freq: 10
  output_dir: ./result