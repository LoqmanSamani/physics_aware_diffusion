experiment:
  name: analytic_graph_isotropic_gaussian
  device: cuda

dataset:
  name: GraphGaussian3DToy
  n_samples: 12800
  sigma_min: 0.1
  sigma_max: 2.0
  min_nodes: 2
  max_nodes: 2

model:
  name: graph_score_net
  time_embedding: TimeEmbedding
  atom_dim: 1
  hidden_dim: 128
  num_layers: 2
  num_heads: 2
  edge_dim: 50
  dropout: 0.2

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.0001
  precision: fp32
  optimizer: adam